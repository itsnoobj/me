<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <rect width="800" height="320" fill="#1a1a1a"/>
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#e0e0e0" font-weight="600">Match the Medium to the Relational Weight</text>
  <text x="400" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">not the complexity of the ask — the stakes for the relationship</text>

  <!-- Row 1: Text -->
  <rect x="60" y="80" width="110" height="40" rx="6" fill="#c45a3c" opacity="0.1" stroke="#c45a3c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="115" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c45a3c" opacity="0.9">Text</text>
  <line x1="170" y1="100" x2="220" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="240" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#ccc">"Can you review this PR?"</text>
  <text x="240" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#888">low stakes, quick turnaround expected</text>

  <!-- Row 2: Voice/Call -->
  <rect x="60" y="140" width="110" height="40" rx="6" fill="#f0a500" opacity="0.1" stroke="#f0a500" stroke-width="1" stroke-opacity="0.4"/>
  <text x="115" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f0a500" opacity="0.9">Call</text>
  <line x1="170" y1="160" x2="220" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="240" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#ccc">"Can you reprioritize this week?"</text>
  <text x="240" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#888">asking them to change their plan</text>

  <!-- Row 3: Video -->
  <rect x="60" y="200" width="110" height="40" rx="6" fill="#5ab0ff" opacity="0.1" stroke="#5ab0ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="115" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5ab0ff" opacity="0.9">Video</text>
  <line x1="170" y1="220" x2="220" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="240" y="225" font-family="system-ui, sans-serif" font-size="13" fill="#ccc">"Can your team take this on?"</text>
  <text x="240" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#888">asking a group to absorb unplanned work</text>

  <!-- Row 4: In person -->
  <rect x="60" y="260" width="110" height="40" rx="6" fill="#4a9eff" opacity="0.15" stroke="#4a9eff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="115" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4a9eff" opacity="0.95">In person</text>
  <line x1="170" y1="280" x2="220" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="240" y="285" font-family="system-ui, sans-serif" font-size="13" fill="#ccc">trust repair, hard feedback, real conflict</text>
  <text x="240" y="302" font-family="system-ui, sans-serif" font-size="10" fill="#888">highest relational stakes</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
