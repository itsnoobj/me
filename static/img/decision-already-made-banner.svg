<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="800" height="250" fill="#1a1a1a"/>

  <!-- Faded path already taken, curving from center down-left -->
  <path d="M 400 80 C 400 110, 320 110, 300 150 C 285 180, 250 190, 210 195" fill="none" stroke="#f0a500" stroke-width="4" stroke-linecap="round" opacity="0.28" stroke-dasharray="2 10"/>

  <!-- Live path taken, curving from center down-right -->
  <path d="M 400 80 C 400 110, 480 110, 500 150 C 515 180, 550 190, 590 195" fill="none" stroke="#f0a500" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- Fork point -->
  <circle cx="400" cy="80" r="9" fill="#f0a500"/>

  <!-- Faded endpoint (the road not taken) -->
  <circle cx="210" cy="195" r="6" fill="#f0a500" opacity="0.28"/>

  <!-- Live endpoint (the decision made) -->
  <circle cx="590" cy="195" r="7" fill="#f0a500" opacity="0.9"/>

  <!-- small checkmark-esque arrival mark on the live path -->
  <path d="M 578 190 L 588 200 L 604 182" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <text x="400" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#e0e0e0">The Decision You Already Made</text>
</svg>
