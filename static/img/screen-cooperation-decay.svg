<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <rect width="800" height="300" fill="#1a1a1a"/>
  <!-- Axis -->
  <line x1="100" y1="230" x2="720" y2="230" stroke="#555" stroke-width="1"/>
  <line x1="100" y1="60" x2="100" y2="230" stroke="#555" stroke-width="1"/>
  <!-- Y axis label -->
  <text x="45" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888" transform="rotate(-90, 45, 145)">cooperation likelihood</text>
  <!-- X axis label -->
  <text x="410" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888">distance from the person (physical + psychological)</text>
  <!-- Exponential decay curve -->
  <path d="M100,70 C150,72 180,90 220,130 C260,170 320,200 400,215 C480,225 580,228 720,229" stroke="#4a9eff" stroke-width="2.5" fill="none" opacity="0.8"/>
  <!-- Markers on curve -->
  <circle cx="120" cy="72" r="5" fill="#4a9eff" opacity="0.9"/>
  <text x="135" y="65" font-family="system-ui, sans-serif" font-size="10" fill="#4a9eff">same desk</text>
  <circle cx="180" cy="90" r="5" fill="#4a9eff" opacity="0.7"/>
  <text x="195" y="83" font-family="system-ui, sans-serif" font-size="10" fill="#4a9eff">same floor</text>
  <circle cx="280" cy="160" r="5" fill="#f0a500" opacity="0.7"/>
  <text x="295" y="153" font-family="system-ui, sans-serif" font-size="10" fill="#f0a500">video call</text>
  <circle cx="420" cy="218" r="5" fill="#c45a3c" opacity="0.6"/>
  <text x="435" y="211" font-family="system-ui, sans-serif" font-size="10" fill="#c45a3c">Slack message</text>
  <circle cx="600" cy="227" r="5" fill="#c45a3c" opacity="0.4"/>
  <text x="615" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#c45a3c" opacity="0.6">Jira ticket</text>
  <!-- The cliff annotation -->
  <path d="M150,100 L150,120" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="170" y="125" font-family="system-ui, sans-serif" font-size="9" fill="#888" opacity="0.6">the cliff (Allen, 1977)</text>
  <!-- Bottom note -->
  <text x="400" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#666">digital tools moved the cliff — they didn't remove it (Waber, 2013)</text>
</svg>
